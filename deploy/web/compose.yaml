services:
  website:
    image: ghcr.io/apptive-game-team/theevilent:${WEBSITE_IMAGE_TAG:-latest}
    container_name: theevilent
    restart: unless-stopped
    expose:
      - "8080"
    networks: [net]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  net:
    external: true
