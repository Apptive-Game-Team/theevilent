map $request_uri $comic_robots {
    default "";
    ~^/arcane-casters/comic(?:/|\?|$) "noindex, noimageindex";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag $comic_robots always;

    location ~ /\. { return 404; }

    location = /arcane-casters/comic {
        return 307 /arcane-casters/comic/ko;
    }
    location ~ ^/arcane-casters/comic/([1-7])$ {
        return 307 /arcane-casters/comic/$1/ko;
    }

    location /assets/ {
        try_files $uri =404;
    }
    location ~* \.(?:js|css|wasm|json|webmanifest|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|mp4|html)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
