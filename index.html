<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/arcane-casters-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/arcane-casters-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/arcane-casters-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --color-ground on :root. useDocumentTheme() rewrites this when a
         page opts into a theme whose ground is a different colour. -->
    <meta name="theme-color" content="#f4f7ea" />
    <title>Arcane Casters — The Evil Ent</title>
    <meta
      name="description"
      content="햇빛 드는 초원에서 마법 카드를 합쳐 정령을 부르는 실시간 PvP, Arcane Casters. The Evil Ent 가 만듭니다."
    />

    <!-- Pretendard. The Unity client ships the same family
         (client/Assets/Art/Fonts/Pretendard-*.otf), so the site and the game
         set Korean text in one typeface. The dynamic subset splits the Korean
         range across ~300 files and the browser fetches only the blocks the
         page actually uses. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
