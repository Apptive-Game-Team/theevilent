name: Build and Publish Website Image
on:
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    paths:
      - 'deploy/web/**'
      - '.github/workflows/web-image.yml'
      - 'vercel.json'
      - 'scripts/build-comic-pages.mjs'
permissions:
  contents: read
concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Build and check Nginx image
        run: |
          bash deploy/web/build-image.sh website-check dist
          bash deploy/web/check-image.sh website-check dist
      - name: Save verified image
        if: github.event_name != 'pull_request'
        run: docker save website-check | gzip > website-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: website-image
          path: website-image.tar.gz
          retention-days: 1
  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/theevilent
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          gunzip -c website-image.tar.gz | docker load
          docker tag website-check "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker tag website-check "$image:dev"
          docker push "$image:dev"
          echo "Website image: \`$image:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
